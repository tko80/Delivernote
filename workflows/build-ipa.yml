name: Build DeliveryNote IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode targets
        run: xcodebuild -list -project DeliveryNote.xcodeproj

      - name: Build iOS target directly
        run: |
          xcodebuild \
            -project DeliveryNote.xcodeproj \
            -target DeliveryNote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeliveryNote.app Payload/
          zip -r DeliveryNote-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNote-IPA
          path: DeliveryNote-unsigned.ipa
          retention-days: 14
